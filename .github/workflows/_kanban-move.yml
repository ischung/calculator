# 재사용 가능한 공통 워크플로우 — 칸반 이슈 상태 이동
name: Kanban — Move Issue Status (Reusable)

on:
  workflow_call:
    inputs:
      status:
        description: "이동할 칸반 컬럼 이름 (예: Review, Done)"
        required: true
        type: string
      pr_body:
        description: "PR 본문 (closes/fixes #N 파싱용)"
        required: true
        type: string
    secrets:
      KANBAN_TOKEN:
        required: true

jobs:
  move:
    runs-on: ubuntu-latest
    steps:
      - name: Move linked issues to ${{ inputs.status }}
        env:
          GH_TOKEN: ${{ secrets.KANBAN_TOKEN }}
          OWNER: ${{ github.repository_owner }}
          PR_BODY: ${{ inputs.pr_body }}
          TARGET_STATUS: ${{ inputs.status }}
          KANBAN_PROJECT_NUMBER: ${{ vars.KANBAN_PROJECT_NUMBER }}
        run: |
          set -euo pipefail
          unset GITHUB_OUTPUT GITHUB_ENV

          if [ -z "$GH_TOKEN" ]; then
            echo "::error::KANBAN_TOKEN secret이 설정되지 않았습니다."
            exit 1
          fi

          if [ -n "$KANBAN_PROJECT_NUMBER" ]; then
            PROJECT_NUMBER="$KANBAN_PROJECT_NUMBER"
          else
            PROJECT_NUMBER=$(gh project list --owner "$OWNER" \
              --format json --limit 1 | jq -r '.projects[0].number')
          fi
          echo "PROJECT_NUMBER=$PROJECT_NUMBER"

          PROJECT_ID=$(gh project list --owner "$OWNER" --format json --limit 20 | \
            jq -r ".projects[] | select(.number==($PROJECT_NUMBER | tonumber)) | .id")

          FIELD_JSON=$(gh project field-list "$PROJECT_NUMBER" --owner "$OWNER" --format json)
          STATUS_FIELD_ID=$(echo "$FIELD_JSON" | \
            jq -r '.fields[] | select(.name=="Status") | .id')
          TARGET_OPTION_ID=$(echo "$FIELD_JSON" | \
            jq -r --arg s "$TARGET_STATUS" \
              '.fields[] | select(.name=="Status") | .options[] | select(.name==$s) | .id')

          ISSUE_NUMBERS=$(echo "$PR_BODY" | \
            grep -oiE '(closes?|fixes?|resolves?)[[:space:]]+#[0-9]+' | \
            grep -oE '[0-9]+$' || true)

          if [ -z "$ISSUE_NUMBERS" ]; then
            echo "링크된 이슈 없음. 종료."
            exit 0
          fi

          for ISSUE_NUM in $ISSUE_NUMBERS; do
            # organization 쿼리 시도 (실패해도 pipefail에 의해 중단되지 않도록 || true)
            ITEM_ID=$(
              gh api graphql \
                -f query='query($owner:String!,$num:Int!){organization(login:$owner){projectV2(number:$num){items(first:200){nodes{id content{...on Issue{number}}}}}}}' \
                -f owner="$OWNER" -F num="$PROJECT_NUMBER" 2>/dev/null || true
            )
            ITEM_ID=$(echo "$ITEM_ID" | jq -r --argjson n "$ISSUE_NUM" \
              '(.data.organization.projectV2.items.nodes // [])[] | select(.content.number == $n) | .id' 2>/dev/null || true)

            if [ -z "$ITEM_ID" ]; then
              # user 쿼리 시도 (개인 계정)
              ITEM_ID=$(
                gh api graphql \
                  -f query='query($owner:String!,$num:Int!){user(login:$owner){projectV2(number:$num){items(first:200){nodes{id content{...on Issue{number}}}}}}}' \
                  -f owner="$OWNER" -F num="$PROJECT_NUMBER" 2>/dev/null || true
              )
              ITEM_ID=$(echo "$ITEM_ID" | jq -r --argjson n "$ISSUE_NUM" \
                '(.data.user.projectV2.items.nodes // [])[] | select(.content.number == $n) | .id' 2>/dev/null || true)
            fi

            if [ -z "$ITEM_ID" ]; then
              echo "  ⚠️  이슈 #$ISSUE_NUM 가 프로젝트에 없음, 건너뜀"
              continue
            fi

            gh project item-edit \
              --project-id "$PROJECT_ID" \
              --id "$ITEM_ID" \
              --field-id "$STATUS_FIELD_ID" \
              --single-select-option-id "$TARGET_OPTION_ID"
            echo "  ✅ 이슈 #$ISSUE_NUM $TARGET_STATUS 이동 완료"
          done
